name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    name: Publish preview to pkg.pr.new
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # pkg.pr.new posts install instructions as a PR comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm ci:install
      - name: Build all packages
        run: pnpm build
      # pkg.pr.new authenticates through its GitHub App; no npm token is involved.
      - name: Publish preview to pkg.pr.new # zizmor: ignore[use-trusted-publishing]
        run: pnpm exec pkg-pr-new publish './packages/*' --compact --pnpm
