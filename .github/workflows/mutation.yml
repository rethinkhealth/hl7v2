name: Mutation testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly full run, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read # checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: ${{ github.event_name == 'pull_request' && 'Mutation testing (changed packages)' || 'Mutation testing (all packages)' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # the score table is posted as one comment, edited on each push

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # turbo's `[origin/main]` filter needs the base ref.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm ci:install
      - name: Build
        run: pnpm build
      - name: Mutate changed packages
        if: github.event_name == 'pull_request'
        run: pnpm mutate:changed
      - name: Mutate all packages
        if: github.event_name != 'pull_request'
        run: pnpm mutate
      - name: Upload reports
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-reports
          path: packages/*/reports/
          if-no-files-found: ignore
      - name: Summarize scores
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # The report exits 1 below a break; the gate already failed on the
        # Stryker step, so the table is still written.
        run: |
          pnpm --silent mutate:report --format markdown > mutation-report.md || true
          cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment scores on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: mutation-report
          path: mutation-report.md
